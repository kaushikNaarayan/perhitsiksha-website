name: PR Validation

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Allow only one concurrent validation per PR
concurrency:
  group: pr-validate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, gt2]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    # Blocking on purpose (no continue-on-error): this reuses the PII denylist
    # in scripts/validate-events-data.js (see pw-ky2) against the events data
    # as it stands after this PR's changes, whole-file rather than diff-only —
    # the denylist is keyed on known-bad event IDs/image filenames, so it must
    # assert "the committed file doesn't contain them" regardless of which PR
    # last touched the file. A red run here must fail the job. See pw-djx.
    - name: PII denylist check
      run: npm run validate:events

    - name: Run ESLint
      run: npm run lint
      
    - name: Run TypeScript check
      run: npx tsc --noEmit
      
    - name: Run tests
      env:
        VITE_COUNTER_WORKSPACE: ${{ secrets.DEV_COUNTER_WORKSPACE || 'perhitsiksha' }}
        VITE_ENVIRONMENT: development
        VITE_COUNTER_BASE_COUNT: "10"
      run: npm run test:coverage
      
    - name: Upload test coverage
      uses: codecov/codecov-action@v3
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
        
    - name: Build project
      env:
        VITE_COUNTER_WORKSPACE: ${{ secrets.DEV_COUNTER_WORKSPACE || 'perhitsiksha' }}
        VITE_ENVIRONMENT: staging
        VITE_COUNTER_BASE_COUNT: "100"
      run: npm run build

  size-check:
    runs-on: [self-hosted, gt2]
    needs: validate
    # size-limit-action posts a PR comment; without this the default read-only
    # GITHUB_TOKEN fails with "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    # size-limit-action internally runs `git fetch origin <base>` then
    # `git checkout -f <base>` (no local branch, no `origin/` prefix) to build
    # the base-branch bundle for comparison. On this self-hosted runner's
    # persistent workspace, prior job runs (including checkouts of other repos
    # that reuse the same path — see pw-kgt) can leave stray remotes that also
    # carry a `main` ref, so `main` matches more than one remote-tracking
    # branch and the bare checkout dies with "fatal: 'main' matched multiple
    # (2) remote tracking branches" before any size comparison runs (pw-9q5).
    # Fix at the source: strip every remote but `origin`, then pre-create a
    # local `main` branch tracking `origin/main` so the action's later
    # `git checkout -f main` resolves the unambiguous local branch instead of
    # DWIM-matching remote-tracking refs.
    - name: Disambiguate base branch for size comparison
      run: |
        for remote in $(git remote); do
          if [ "$remote" != "origin" ]; then
            echo "Removing stray remote: $remote"
            git remote remove "$remote"
          fi
        done
        git fetch origin main --depth=1
        git branch -f main origin/main

    - name: Build for size check
      env:
        VITE_COUNTER_WORKSPACE: perhitsiksha
        VITE_ENVIRONMENT: production
      run: npm run build

    - name: Check bundle size
      uses: andresz1/size-limit-action@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        package_manager: npm
        
  accessibility-check:
    runs-on: [self-hosted, gt2]
    needs: validate
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      env:
        VITE_COUNTER_WORKSPACE: ${{ secrets.DEV_COUNTER_WORKSPACE || 'perhitsiksha' }}
        VITE_ENVIRONMENT: staging
        VITE_COUNTER_BASE_COUNT: "100"
      run: npm run build
      
    - name: Reap orphan preview servers on port 3000
      run: |
        # Shared self-hosted gt2 runner: a prior job's `vite preview` can be
        # left squatting on :3000, which silently bumps this job onto :3003+
        # and makes axe test a stale/unrelated build (pw-on6.6). Kill
        # whatever's on 3000 before we claim it ourselves.
        PIDS="$(lsof -ti tcp:3000 2>/dev/null || true)"
        if [ -n "$PIDS" ]; then
          echo "Killing orphan process(es) on port 3000: $PIDS"
          kill -9 $PIDS || true
        fi

    - name: Serve built files
      run: npx vite preview --port 3000 --strictPort &

    - name: Wait for server
      run: npx wait-on http://localhost:3000
      
    - name: Run accessibility tests
      run: |
        npm install -g @axe-core/cli

        # $CHROMEWEBDRIVER only exists on GitHub-hosted runners; it's unset on
        # this self-hosted gt2 runner, so the old `--chromedriver-path
        # "$CHROMEWEBDRIVER/chromedriver"` collapsed to the literal, nonexistent
        # `/chromedriver` and axe never ran a single check (pw-9q5). Omitting
        # --chromedriver-path entirely isn't a fix either: @axe-core/cli then
        # falls back to its own bundled `chromedriver` npm package, which lags
        # the runner's installed Chrome and fails with "session not created:
        # only supports Chrome version N" (the exact failure the old comment
        # warned about, still reproduced by the nightly accessibility-audit job).
        #
        # Selenium Manager (bundled with @axe-core/cli's selenium-webdriver
        # dependency) is built for exactly this: it detects the installed
        # browser and downloads/caches a matching driver, on any runner, hosted
        # or self-hosted, with no assumption about pre-installed paths.
        SM_BIN="$(find "$(npm root -g)" -type f -path '*/selenium-webdriver/bin/linux/selenium-manager' -print -quit)"
        if [ -z "$SM_BIN" ] || [ ! -x "$SM_BIN" ]; then
          echo "::error::Selenium Manager binary not found under $(npm root -g) — cannot resolve a chromedriver for axe-core." >&2
          exit 1
        fi

        SM_OUTPUT="$("$SM_BIN" --browser chrome --output json)"
        DRIVER_PATH="$(echo "$SM_OUTPUT" | jq -r '.result.driver_path // empty')"
        if [ -z "$DRIVER_PATH" ] || [ ! -x "$DRIVER_PATH" ]; then
          echo "::error::Selenium Manager failed to resolve a working chromedriver binary. Output:" >&2
          echo "$SM_OUTPUT" >&2
          exit 1
        fi
        echo "Resolved chromedriver via Selenium Manager: $DRIVER_PATH"

        axe http://localhost:3000 --exit --chromedriver-path "$DRIVER_PATH"

  e2e-tests:
    runs-on: [self-hosted, gt2]
    needs: validate

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Self-hosted gt2 runners are bare Node images, not the Playwright
    # GitHub-hosted image — they do NOT ship Playwright's browsers. A run
    # that skips this step doesn't fail loudly; every test times out waiting
    # for a browser launch that never completes (pw-goht). --with-deps also
    # installs the OS-level shared libraries Chromium needs, which a bare
    # runner won't have either.
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    # Playwright's own webServer (see playwright.config.ts) launches
    # `npm run dev` on a DEDICATED port (3100 under CI) precisely so this
    # job can never collide with accessibility-check's :3000 preview server
    # when both land on the same shared gt2 runner and run concurrently —
    # that happened for real on this job's first CI run (32559739222):
    # accessibility-check's reap step killed this suite's dev server
    # mid-test, well after the two jobs had started in parallel, so a step
    # ordering fix alone (running earlier) would not have been safe against
    # it. Different port means the two reap steps can never target each
    # other's process, no matter the timing.
    - name: Reap orphan dev servers on port 3100
      run: |
        PIDS="$(lsof -ti tcp:3100 2>/dev/null || true)"
        if [ -n "$PIDS" ]; then
          echo "Killing orphan process(es) on port 3100: $PIDS"
          kill -9 $PIDS || true
        fi

    # PR-validate, not deploy.yml: on this repo push-to-main IS the deploy
    # (deploy.yml triggers on push to main), so a check that only runs there
    # fires after shipping has already started — not a gate. This is the
    # pre-merge check.
    #
    # `--reporter=list,json` + PLAYWRIGHT_JSON_OUTPUT_NAME: the list reporter
    # is for the human-readable log; the JSON file feeds the next step, which
    # explicitly fails the job if zero specs were matched. A job that
    # silently no-ops on zero matched specs also exits 0 — that is the exact
    # failure mode pw-goht exists to close, so "green" alone is not proof;
    # the log must show a nonzero test count.
    - name: Run Playwright E2E suite
      env:
        VITE_COUNTER_WORKSPACE: ${{ secrets.DEV_COUNTER_WORKSPACE || 'perhitsiksha' }}
        VITE_ENVIRONMENT: development
        VITE_COUNTER_BASE_COUNT: "10"
        PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
      run: npx playwright test --reporter=list,json

    - name: Verify the suite actually ran specs
      if: always()
      run: |
        if [ ! -f playwright-results.json ]; then
          echo "::error::playwright-results.json missing — the suite did not run at all."
          exit 1
        fi
        node -e '
          const r = require("./playwright-results.json");
          const total = (r.stats?.expected ?? 0) + (r.stats?.unexpected ?? 0) + (r.stats?.flaky ?? 0);
          console.log("Playwright ran " + total + " test(s): " + JSON.stringify(r.stats));
          if (total === 0) {
            console.error("::error::0 tests matched — this job would silently pass on an empty suite. Failing explicitly.");
            process.exit(1);
          }
        '

    - name: Upload Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7