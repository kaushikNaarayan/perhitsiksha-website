name: PR Validation

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      exercise_job_timeout_negative:
        description: 'Prove timeout cancellation plus the deliberate red verdict (manual only)'
        required: false
        default: false
        type: boolean

# Allow only one concurrent validation per PR
concurrency:
  group: pr-validate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    # The manual timeout control deliberately exercises only its own bounded
    # job; production PR validation always runs this normal path.
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.exercise_job_timeout_negative }}
    runs-on: [self-hosted, gt2]
    # Bound every shared-runner job so a setup or cache stall becomes terminal
    # cancelled/non-success instead of occupying a gt2 slot indefinitely. The
    # manual control's dependent verdict proves the explicit red negative signal.
    timeout-minutes: 20
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Configure per-job npm cache dir
      # pw-on6.8: every gt2 runner runs as user kanaba and shares ONE
      # ~/.npm cache by default. When this job's npm ci races another gt2
      # job's npm ci (this workflow's own concurrent jobs, or another rig's),
      # cacache's tmp->content rename collides and npm ci exits 254 with a
      # spurious EEXIST/ENOENT. runner.temp is wiped at the start/end of each
      # job and is exclusive to it. `runner` isn't available in job-level
      # `env:` (only inside steps), so write it to $GITHUB_ENV here, before
      # Setup Node.js resolves npm's cache dir, so every later step
      # (including npm ci) installs against an isolated dir instead of
      # racing the shared one.
      run: echo "NPM_CONFIG_CACHE=${{ runner.temp }}/npm-cache" >> "$GITHUB_ENV"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    # Blocking on purpose (no continue-on-error): this reuses the PII denylist
    # in scripts/validate-events-data.js (see pw-ky2) against the events data
    # as it stands after this PR's changes, whole-file rather than diff-only —
    # the denylist is keyed on known-bad event IDs/image filenames, so it must
    # assert "the committed file doesn't contain them" regardless of which PR
    # last touched the file. A red run here must fail the job. See pw-djx.
    - name: PII denylist check
      run: npm run validate:events

    - name: Run ESLint
      run: npm run lint
      
    - name: Run TypeScript check
      run: npx tsc --noEmit
      
    - name: Run tests
      env:
        VITE_COUNTER_WORKSPACE: ${{ secrets.DEV_COUNTER_WORKSPACE || 'perhitsiksha' }}
        VITE_ENVIRONMENT: development
        VITE_COUNTER_BASE_COUNT: "10"
      run: npm run test:coverage
      
    - name: Upload test coverage
      uses: codecov/codecov-action@v3
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
        
    - name: Build project
      env:
        VITE_COUNTER_WORKSPACE: ${{ secrets.DEV_COUNTER_WORKSPACE || 'perhitsiksha' }}
        VITE_ENVIRONMENT: staging
        VITE_COUNTER_BASE_COUNT: "100"
      run: npm run build

  size-check:
    runs-on: [self-hosted, gt2]
    needs: validate
    timeout-minutes: 20
    # size-limit-action posts a PR comment; without this the default read-only
    # GITHUB_TOKEN fails with "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Configure per-job npm cache dir
      # pw-on6.8: every gt2 runner runs as user kanaba and shares ONE
      # ~/.npm cache by default. When this job's npm ci races another gt2
      # job's npm ci (this workflow's own concurrent jobs, or another rig's),
      # cacache's tmp->content rename collides and npm ci exits 254 with a
      # spurious EEXIST/ENOENT. runner.temp is wiped at the start/end of each
      # job and is exclusive to it. `runner` isn't available in job-level
      # `env:` (only inside steps), so write it to $GITHUB_ENV here, before
      # Setup Node.js resolves npm's cache dir, so every later step
      # (including npm ci) installs against an isolated dir instead of
      # racing the shared one.
      run: echo "NPM_CONFIG_CACHE=${{ runner.temp }}/npm-cache" >> "$GITHUB_ENV"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    # size-limit-action internally runs `git fetch origin <base>` then
    # `git checkout -f <base>` (no local branch, no `origin/` prefix) to build
    # the base-branch bundle for comparison. On this self-hosted runner's
    # persistent workspace, prior job runs (including checkouts of other repos
    # that reuse the same path — see pw-kgt) can leave stray remotes that also
    # carry a `main` ref, so `main` matches more than one remote-tracking
    # branch and the bare checkout dies with "fatal: 'main' matched multiple
    # (2) remote tracking branches" before any size comparison runs (pw-9q5).
    # Fix at the source: strip every remote but `origin`, then pre-create a
    # local `main` branch tracking `origin/main` so the action's later
    # `git checkout -f main` resolves the unambiguous local branch instead of
    # DWIM-matching remote-tracking refs.
    - name: Disambiguate base branch for size comparison
      run: |
        for remote in $(git remote); do
          if [ "$remote" != "origin" ]; then
            echo "Removing stray remote: $remote"
            git remote remove "$remote"
          fi
        done
        git fetch origin main --depth=1
        git branch -f main origin/main

    - name: Build for size check
      env:
        VITE_COUNTER_WORKSPACE: perhitsiksha
        VITE_ENVIRONMENT: production
      run: npm run build

    - name: Check bundle size
      uses: andresz1/size-limit-action@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        package_manager: npm
        
  accessibility-check:
    runs-on: [self-hosted, gt2]
    needs: validate
    timeout-minutes: 20
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Configure per-job npm cache dir
      # pw-on6.8: every gt2 runner runs as user kanaba and shares ONE
      # ~/.npm cache by default. When this job's npm ci races another gt2
      # job's npm ci (this workflow's own concurrent jobs, or another rig's),
      # cacache's tmp->content rename collides and npm ci exits 254 with a
      # spurious EEXIST/ENOENT. runner.temp is wiped at the start/end of each
      # job and is exclusive to it. `runner` isn't available in job-level
      # `env:` (only inside steps), so write it to $GITHUB_ENV here, before
      # Setup Node.js resolves npm's cache dir, so every later step
      # (including npm ci) installs against an isolated dir instead of
      # racing the shared one.
      run: |
        echo "NPM_CONFIG_CACHE=${{ runner.temp }}/npm-cache" >> "$GITHUB_ENV"
        # Browser binaries are isolated to this disposable job directory.
        echo "PLAYWRIGHT_BROWSERS_PATH=${{ runner.temp }}/ms-playwright" >> "$GITHUB_ENV"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      env:
        VITE_COUNTER_WORKSPACE: ${{ secrets.DEV_COUNTER_WORKSPACE || 'perhitsiksha' }}
        VITE_ENVIRONMENT: staging
        VITE_COUNTER_BASE_COUNT: "100"
      run: npm run build
      
    - name: Reap orphan preview servers on port 3000
      run: |
        # Shared self-hosted gt2 runner: a prior job's `vite preview` can be
        # left squatting on :3000, which silently bumps this job onto :3003+
        # and makes axe test a stale/unrelated build (pw-on6.6). Kill
        # whatever's on 3000 before we claim it ourselves.
        PIDS="$(lsof -ti tcp:3000 2>/dev/null || true)"
        if [ -n "$PIDS" ]; then
          echo "Killing orphan process(es) on port 3000: $PIDS"
          kill -9 $PIDS || true
        fi

    - name: Serve built files
      run: npx vite preview --port 3000 --strictPort &

    - name: Wait for server
      run: npx wait-on http://localhost:3000
      
    - name: Run accessibility tests
      run: |
        npx playwright install chromium
        npm run test:a11y -- http://localhost:3000 http://localhost:3000/about http://localhost:3000/testimonials
        npm run test:a11y -- --seed-violation --expect-failure --expect-image-alt
        if npm run test:a11y -- --seed-conforming --expect-failure --expect-image-alt; then
          echo "::error::Conforming image unexpectedly satisfied the image-alt control" >&2
          exit 1
        fi
        if npm run test:a11y -- --never-settles; then
          echo "::error::Accessibility readiness control unexpectedly settled" >&2
          exit 1
        fi

  e2e-tests:
    runs-on: [self-hosted, gt2]
    needs: validate
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure per-job npm cache dir
      # pw-on6.8: every gt2 runner runs as user kanaba and shares ONE
      # ~/.npm cache by default. When this job's npm ci races another gt2
      # job's npm ci (this workflow's own concurrent jobs, or another rig's),
      # cacache's tmp->content rename collides and npm ci exits 254 with a
      # spurious EEXIST/ENOENT. runner.temp is wiped at the start/end of each
      # job and is exclusive to it. `runner` isn't available in job-level
      # `env:` (only inside steps), so write it to $GITHUB_ENV here, before
      # Setup Node.js resolves npm's cache dir, so every later step
      # (including npm ci) installs against an isolated dir instead of
      # racing the shared one.
      run: echo "NPM_CONFIG_CACHE=${{ runner.temp }}/npm-cache" >> "$GITHUB_ENV"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Install Playwright's pinned browser without mutating runner-wide OS
    # packages. The gt2 image owns its system dependencies; CI jobs must not
    # mutate system packages on shared self-hosted hosts.
    - name: Install Playwright browsers
      run: |
        BROWSERS_PATH="${{ runner.temp }}/ms-playwright"
        export PLAYWRIGHT_BROWSERS_PATH="$BROWSERS_PATH"
        echo "PLAYWRIGHT_BROWSERS_PATH=$BROWSERS_PATH" >> "$GITHUB_ENV"

        npx playwright install chromium

        BROWSER_EXECUTABLE="$(find "$BROWSERS_PATH" -type f \( -name chrome -o -name chrome-headless-shell \) -perm -u+x -print -quit)"
        if [ -z "$BROWSER_EXECUTABLE" ]; then
          echo "::error::Playwright installed no executable Chromium under $BROWSERS_PATH"
          exit 1
        fi
        echo "Installed job-local Chromium executable: $BROWSER_EXECUTABLE"

    - name: Verify E2E lifecycle harness contracts
      run: npm run test:ci-harness

    - name: Run deliberately failing Playwright negative control
      id: playwright-negative-control
      continue-on-error: true
      env:
        PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/negative-control-results.json
        PLAYWRIGHT_CI_ARGS_JSON: '["test","--config=scripts/fixtures/playwright-failure.config.mjs","--reporter=list,json"]'
        PLAYWRIGHT_CI_DIAGNOSTICS: negative-control-diagnostics.json
        PLAYWRIGHT_CI_TIMEOUT_MS: "60000"
      run: node scripts/run-playwright-ci.mjs

    - name: Verify Playwright negative control was rejected
      if: always()
      env:
        NEGATIVE_CONTROL_OUTCOME: ${{ steps.playwright-negative-control.outcome }}
      run: |
        if [ "$NEGATIVE_CONTROL_OUTCOME" != "failure" ]; then
          echo "::error::deliberately failing Playwright spec was not rejected"
          exit 1
        fi
        node --input-type=module -e '
          import { readFile } from "node:fs/promises";
          let results;
          try {
            results = JSON.parse(await readFile("negative-control-results.json", "utf8"));
          } catch (error) {
            console.error(`::error::negative control results are missing or invalid: ${error.message}`);
            process.exit(1);
          }
          const stats = results.stats ?? {};
          const expected = Number(stats.expected);
          const unexpected = Number(stats.unexpected);
          const flaky = Number(stats.flaky);
          const skipped = Number(stats.skipped);
          const total = expected + unexpected + flaky + skipped;
          if (
            ![expected, unexpected, flaky, skipped].every(Number.isSafeInteger) ||
            expected !== 0 ||
            unexpected !== 1 ||
            flaky !== 0 ||
            skipped !== 0 ||
            total !== 1
          ) {
            console.error(`::error::negative control had wrong result polarity: ${JSON.stringify(stats)}`);
            process.exit(1);
          }
        '
        set +e
        VERIFIER_OUTPUT="$(node scripts/verify-playwright-results.mjs negative-control-results.json 2>&1)"
        VERIFIER_STATUS=$?
        set -e
        echo "$VERIFIER_OUTPUT"
        if [ "$VERIFIER_STATUS" -eq 0 ]; then
          echo "::error::verifier accepted the deliberately failing Playwright result"
          exit 1
        fi
        if ! printf '%s' "$VERIFIER_OUTPUT" | grep -Fq '1 unexpected test failure(s)'; then
          echo "::error::verifier failed without the expected unexpected-test diagnostic"
          exit 1
        fi
        cat negative-control-diagnostics.json

    # Playwright's own webServer (see playwright.config.ts) launches
    # `npm run dev` on a DEDICATED port (3100 under CI) precisely so this
    # job can never collide with accessibility-check's :3000 preview server
    # when both land on the same shared gt2 runner and run concurrently —
    # that happened for real on this job's first CI run (32559739222):
    # accessibility-check's reap step killed this suite's dev server
    # mid-test, well after the two jobs had started in parallel, so a step
    # ordering fix alone (running earlier) would not have been safe against
    # it. Different port means the two reap steps can never target each
    # other's process, no matter the timing.
    - name: Assert port 3100 is not owned by another job
      run: node scripts/assert-port-clean.mjs 3100

    # PR-validate, not deploy.yml: on this repo push-to-main IS the deploy
    # (deploy.yml triggers on push to main), so a check that only runs there
    # fires after shipping has already started — not a gate. This is the
    # pre-merge check.
    #
    # `--reporter=list,json` + PLAYWRIGHT_JSON_OUTPUT_NAME: the list reporter
    # is for the human-readable log; the JSON file feeds the next step, which
    # explicitly fails the job if zero specs were matched. A job that
    # silently no-ops on zero matched specs also exits 0 — that is the exact
    # failure mode pw-goht exists to close, so "green" alone is not proof;
    # the log must show a nonzero test count.
    - name: Run Playwright E2E suite
      env:
        VITE_COUNTER_WORKSPACE: ${{ secrets.DEV_COUNTER_WORKSPACE || 'perhitsiksha' }}
        VITE_ENVIRONMENT: development
        VITE_COUNTER_BASE_COUNT: "10"
        PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        PLAYWRIGHT_CI_PORT: "3100"
        # This bound is intentionally inside the 20-minute Actions job bound.
        # It owns the entire process group, including Playwright's Vite
        # webServer and browser children, even before the first spec starts.
        PLAYWRIGHT_CI_TIMEOUT_MS: "720000"
      run: |
        BROWSER_EXECUTABLE="$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f \( -name chrome -o -name chrome-headless-shell \) -perm -u+x -print -quit)"
        if [ -z "$BROWSER_EXECUTABLE" ]; then
          echo "::error::No executable Chromium remains under job-local PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH"
          exit 1
        fi
        echo "Using job-local Chromium executable: $BROWSER_EXECUTABLE"
        node scripts/run-playwright-ci.mjs

    - name: Verify the suite actually ran specs
      if: always()
      run: node scripts/verify-playwright-results.mjs

    - name: Prove token-scoped cleanup released port 3100
      if: always()
      run: node scripts/assert-port-clean.mjs 3100

    - name: Upload Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
          playwright-results.json
          playwright-ci-diagnostics.json
        if-no-files-found: warn
        retention-days: 7

  timeout-negative-control:
    # Manual-only, opt-in proof that Actions terminally cancels a wedged job
    # at the deadline; the dependent verdict reports the negative contract red.
    # It has no checkout or dependencies, so it uses at most one gt2 runner
    # for one minute and cannot affect a PR run.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.exercise_job_timeout_negative }}
    runs-on: [self-hosted, gt2]
    timeout-minutes: 1
    steps:
    - name: Deliberately wedge until Actions terminally cancels the timeout job
      run: |
        echo "::notice::Intentional timeout control: terminal cancellation is expected; the verdict reports red."
        while true; do sleep 1; done

  timeout-negative-verdict:
    # GitHub classifies a job-level timeout as cancelled. This dependent job
    # turns that observed cutoff into the intentional red workflow outcome.
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.exercise_job_timeout_negative }}
    needs: timeout-negative-control
    runs-on: [self-hosted, gt2]
    steps:
    - name: Assert the timeout was observed and fail the negative contract
      env:
        TIMEOUT_CONTROL_RESULT: ${{ needs.timeout-negative-control.result }}
      run: |
        if [ "$TIMEOUT_CONTROL_RESULT" != "cancelled" ]; then
          echo "::error::Timeout negative control returned unexpected result: $TIMEOUT_CONTROL_RESULT" >&2
          exit 1
        fi
        echo "::error::Bounded timeout control was observed; deliberately failing the negative contract red." >&2
        exit 1
