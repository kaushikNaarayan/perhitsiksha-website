name: Sync Facebook Events

on:
  # Run daily at 8 AM UTC (1:30 PM IST)
  schedule:
    - cron: '0 8 * * *'

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Fetch and Commit Facebook Events
    runs-on: [self-hosted, gt2]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch Facebook events
        id: fetch
        continue-on-error: true
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        run: npm run fetch:facebook

      - name: Validate events data
        if: steps.fetch.outcome == 'success'
        id: validate
        continue-on-error: true
        run: |
          set +e
          npm run validate:events
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Detect PII denylist trip
        if: steps.validate.outcome == 'failure'
        id: pii-check
        run: |
          if [ "${{ steps.validate.outputs.exit_code }}" = "2" ]; then
            echo "is_pii_trip=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_pii_trip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for changes
        if: steps.validate.outcome == 'success'
        id: git-check
        run: |
          git diff --quiet src/data/facebook-events.json public/fb-events/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        env:
          HUSKY: 0
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/facebook-events.json public/fb-events/
          git commit --no-verify -m "chore: sync Facebook events

          Auto-synced from Facebook page at $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          git push

      - name: Alert on PII denylist trip
        if: steps.pii-check.outputs.is_pii_trip == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 PII denylist trip — Facebook sync blocked (child identity documents detected)';
            const body = `## PII Denylist Trip

            The Facebook events sync ran the PII denylist check (scripts/validate-events-data.js)
            and it FAILED — the source Facebook post currently contains content matching known
            child identity documents (see bead pw-ky2). The sync was stopped on purpose;
            nothing was committed.

            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Action required
            1. Remove the flagged images/post from the Facebook source.
            2. Once removed, re-run this workflow manually (Actions → Sync Facebook Events → Run workflow).
            3. Do NOT relax the PII denylist in scripts/validate-events-data.js to work around this — see pw-ky2.

            ---
            *This issue was automatically created by the sync-facebook-events workflow (PII denylist gate).*`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['facebook-sync', 'pii-alert'],
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['facebook-sync', 'pii-alert', 'bug'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `### Another PII denylist trip occurred

                **Time:** ${new Date().toUTCString()}
                **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              });
            }

      - name: Fail job on PII denylist trip
        if: steps.pii-check.outputs.is_pii_trip == 'true'
        run: |
          echo "::error::PII denylist trip on Facebook sync — sync stopped on purpose, see filed issue."
          exit 1

      - name: Create issue on failure
        if: failure() && steps.pii-check.outputs.is_pii_trip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ Facebook Events Sync Failed';
            const body = `## Sync Failure Report

            The scheduled Facebook events sync failed on ${new Date().toUTCString()}.

            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Possible Causes:
            1. **Access Token Expired**: Facebook Page Access Tokens expire after ~60 days
               - Check token expiry: https://developers.facebook.com/tools/debug/accesstoken/
               - Renew token following instructions in PLAN.md Phase 1
            2. **API Rate Limit**: Facebook Graph API rate limit reached
               - Check API usage in Facebook Developer Console
            3. **Network or API Issues**: Temporary connectivity or Facebook API problems
               - Check Facebook Platform Status: https://developers.facebook.com/status/
            4. **Missing Secrets**: GitHub secrets not configured
               - Verify FACEBOOK_PAGE_ID and FACEBOOK_ACCESS_TOKEN in repository settings

            ### Next Steps:
            1. Review the workflow logs linked above
            2. Check Facebook Developer Console for errors
            3. If token expired, update GitHub secret with new token
            4. Close this issue once resolved

            ---
            *This issue was automatically created by the sync-facebook-events workflow.*`;

            // Check if an open issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['facebook-sync', 'automated'],
            });

            if (issues.data.length === 0) {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['facebook-sync', 'automated', 'bug'],
              });
            } else {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `### Another sync failure occurred

                **Time:** ${new Date().toUTCString()}
                **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              });
            }

      - name: Report success
        if: success() && steps.git-check.outputs.changed == 'true'
        run: |
          echo "✅ Facebook events synced successfully!"
          echo "📊 Changes committed and pushed to repository"

      - name: Report no changes
        if: success() && steps.git-check.outputs.changed != 'true'
        run: |
          echo "ℹ️ No changes detected in Facebook events"
          echo "📊 Events data is already up to date"
