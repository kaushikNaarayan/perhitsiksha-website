name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_run:
    workflows: ["Sync Facebook Events"]
    types: [completed]
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
# via the gh-pages branch (git push), not the Actions Pages-artifact path —
# that path is blocked org-wide by a GitHub Actions artifact storage quota (pw-my4).
permissions:
  contents: write
  actions: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages-production"
  cancel-in-progress: false

jobs:
  pre-deploy-checks:
    runs-on: [self-hosted, gt2]
    # pw-5v3d: the workflow_run trigger above fires on ANY conclusion of the
    # daily Sync Facebook Events cron — success, failure, or cancelled —
    # because `types: [completed]` means "the run finished", not "the run
    # succeeded". Without this guard, a FAILED sync deploys production on
    # whatever is currently on main, unattended, once a day, with no
    # relationship to anyone's intent to release (proven on the org repo:
    # run 32562597778 concluded failure and still queued a deploy on
    # 2026-08-22; this repo's own sync/deploy pair self-triggered
    # independently the same day — run 32562779354). Kept as a job-level
    # `if:` (not removed) rather than decoupling entirely: the sync's
    # commit-and-push step uses the default GITHUB_TOKEN, and GitHub
    # deliberately does not let a GITHUB_TOKEN-authored push trigger other
    # workflows (loop prevention) — so `push: branches: [main]` alone would
    # never fire after a genuinely successful sync. workflow_run is the only
    # way a sync-committed change reaches this workflow at all; the fix is
    # to require it actually succeeded, not to remove the wiring.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      should-deploy: ${{ steps.checks.outputs.should-deploy }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      env:
        VITE_COUNTER_WORKSPACE: ${{ secrets.PROD_COUNTER_WORKSPACE || 'perhitsiksha' }}
        VITE_ENVIRONMENT: production
      # 8/10 VisitorCounter tests are quarantined with it.skip (pw-rld: mock
      # isolation issue with a module-load-order singleton). This actually
      # runs vitest — it is no longer an echo — so it fails loudly on any
      # non-quarantined regression instead of reporting a fake green.
      run: npm run test -- --run
      
    - name: Run linting
      run: npm run lint
      
    - name: Type check
      run: npx tsc --noEmit
      
    - name: Test build
      env:
        VITE_COUNTER_WORKSPACE: ${{ secrets.PROD_COUNTER_WORKSPACE || 'perhitsiksha' }}
        VITE_ENVIRONMENT: production
        VITE_GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        VITE_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
      run: npm run build
      
    - name: Deployment readiness check
      id: checks
      run: |
        echo "All pre-deployment checks passed"
        echo "should-deploy=true" >> $GITHUB_OUTPUT

  build-and-deploy:
    runs-on: [self-hosted, gt2]
    needs: pre-deploy-checks
    if: needs.pre-deploy-checks.outputs.should-deploy == 'true'
    environment:
      name: production
      url: https://www.perhitsiksha.org

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build for production
      env:
        VITE_COUNTER_WORKSPACE: ${{ secrets.PROD_COUNTER_WORKSPACE || 'perhitsiksha' }}
        VITE_ENVIRONMENT: production
        VITE_GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        VITE_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
      run: npm run build

    # Deploy via git push to the gh-pages branch (git storage) instead of
    # actions/upload-pages-artifact + deploy-pages, which upload through
    # GitHub Actions artifact storage — org-wide quota is hit, so that path
    # is hard-blocked regardless of runner (pw-my4). dist/CNAME preserves
    # the custom domain.
    - name: Deploy dist/ to gh-pages branch
      run: |
        cd dist
        git init -q
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git checkout -q -b gh-pages
        git add -A
        git commit -q -m "deploy: ${{ github.sha }}"
        git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages:gh-pages

    - name: Post-deployment verification (bundle freshness, not just HTTP 200)
      run: |
        echo "Verifying the freshly-built bundle actually went live..."
        # The hash of the bundle we JUST built (dist/ from the build step above)
        BUILT=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
        if [ -z "$BUILT" ]; then
          echo "::error::Could not read built bundle hash from dist/index.html"
          exit 1
        fi
        echo "Built bundle: $BUILT"
        # HARD GATE: our actual deploy target (org GitHub Pages) MUST serve that exact
        # bundle. HTTP 200 alone is not enough — a stale/no-op deploy also returns 200.
        ORG_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        ok=""
        for i in $(seq 1 10); do
          sleep 30
          served=$(curl -fsSL "$ORG_URL" 2>/dev/null | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1 || true)
          echo "  org-pages attempt $i — served: ${served:-<none>}"
          if [ "$served" = "$BUILT" ]; then
            ok=1; echo "✅ Org Pages serves the freshly-built bundle — deploy took."; break
          fi
        done
        if [ -z "$ok" ]; then
          echo "::error::DEPLOY DID NOT TAKE — org Pages is not serving $BUILT after ~5min (stale content / propagation / Pages build failure)."
          exit 1
        fi
        # SOFT CHECK: the public custom domain. While the domain move (pw-1b4) is parked,
        # www.perhitsiksha.org points off-org and will lag — warn, do not fail the deploy.
        dom=$(curl -fsS https://www.perhitsiksha.org/ 2>/dev/null | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1 || true)
        if [ "$dom" = "$BUILT" ]; then
          echo "✅ www.perhitsiksha.org also serves the built bundle — fully live."
        else
          echo "::warning::www.perhitsiksha.org serves ${dom:-<none>}, not $BUILT. The custom domain still points off-org (pw-1b4, parked): live on org Pages, NOT on the public domain."
        fi

    - name: Notify deployment success
      if: success()
      run: |
        echo "✅ Production deployment successful!"
        echo "URL: ${{ steps.deployment.outputs.page_url }}"
        # Integration point for notifications (Slack, email, etc.)
        
    - name: Rollback on failure
      if: failure()
      run: |
        echo "❌ Production deployment failed!"
        echo "Consider manual rollback if needed"
        # Could implement automatic rollback logic here

  post-deploy-monitoring:
    runs-on: [self-hosted, gt2]
    needs: build-and-deploy
    if: success()
    
    steps:
    - name: Wait for propagation
      run: sleep 120
      
    - name: Basic health monitoring
      run: |
        echo "Running post-deployment health checks..."
        # Check if site is responding
        response=$(curl -s -o /dev/null -w "%{http_code}" ${{ needs.build-and-deploy.outputs.url || 'https://www.perhitsiksha.org' }})
        if [ "$response" != "200" ]; then
          echo "Health check failed with HTTP $response"
          exit 1
        fi
        echo "Health check passed!"
        
    - name: Database connectivity verification
      run: |
        echo "Verifying database connectivity..."
        # Test Supabase connectivity
        if [ -n "${{ secrets.PROD_SUPABASE_URL }}" ]; then
          echo "Supabase configured - visitor counter will use persistent database"
          # Basic health check for Supabase (no auth required)
          curl -f "${{ secrets.PROD_SUPABASE_URL }}/rest/v1/" -H "apikey: ${{ secrets.PROD_SUPABASE_ANON_KEY }}" || echo "Supabase health check failed but deployment continues"
        else
          echo "Supabase not configured - visitor counter will use fallback Counter API"
          curl -f "https://api.counterapi.dev/v2/perhitsiksha/perhitsiksha-visits" || echo "Counter API check failed but not critical"
        fi
        echo "Database connectivity verification completed"